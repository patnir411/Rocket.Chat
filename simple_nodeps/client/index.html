<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimplChat - Modern Group Chat</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-container">
    <div class="login-box">
      <h1>📱 SimplChat</h1>
      <p class="tagline">Modern. Fast. Zero Dependencies.</p>

      <div id="login-form" class="auth-form">
        <h2>Sign In</h2>
        <input type="text" id="login-username" placeholder="Username" autocomplete="username" required>
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
        <button id="login-btn" class="btn btn-primary">Sign In</button>
        <p class="form-footer">
          Don't have an account?
          <a href="#" id="show-register">Register</a>
        </p>
      </div>

      <div id="register-form" class="auth-form" style="display: none;">
        <h2>Create Account</h2>
        <input type="text" id="register-username" placeholder="Username" autocomplete="username" required>
        <input type="email" id="register-email" placeholder="Email (optional)" autocomplete="email">
        <input type="password" id="register-password" placeholder="Password" autocomplete="new-password" required>
        <input type="text" id="register-displayname" placeholder="Display Name (optional)">
        <button id="register-btn" class="btn btn-primary">Create Account</button>
        <p class="form-footer">
          Already have an account?
          <a href="#" id="show-login">Sign In</a>
        </p>
      </div>

      <div id="auth-error" class="error-message" style="display: none;"></div>
    </div>
  </div>

  <!-- Main Chat Interface -->
  <div id="chat-screen" class="chat-container" style="display: none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>SimplChat</h2>
        <button id="new-room-btn" class="btn btn-icon" title="Create Room">+</button>
      </div>

      <div class="user-status">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Loading...</div>
          <div class="status-selector">
            <select id="status-selector">
              <option value="online">🟢 Online</option>
              <option value="away">🟡 Away</option>
              <option value="busy">🔴 Busy</option>
              <option value="offline">⚫ Offline</option>
            </select>
          </div>
        </div>
      </div>

      <div class="rooms-filter">
        <input type="text" id="rooms-search" placeholder="Search rooms...">
      </div>

      <div class="rooms-list" id="rooms-list">
        <!-- Rooms will be inserted here -->
      </div>

      <div class="sidebar-footer">
        <button id="logout-btn" class="btn btn-secondary">Sign Out</button>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="main-content">
      <div id="no-room-selected" class="no-room">
        <div class="no-room-content">
          <h2>👋 Welcome to SimplChat!</h2>
          <p>Select a room from the sidebar to start chatting</p>
          <p>or</p>
          <button id="create-first-room" class="btn btn-primary">Create Your First Room</button>
        </div>
      </div>

      <div id="room-view" style="display: none;">
        <!-- Room Header -->
        <header class="room-header">
          <div class="room-info">
            <h3 id="room-name">Room Name</h3>
            <div id="room-topic" class="room-topic"></div>
          </div>
          <div class="room-actions">
            <button id="room-info-btn" class="btn btn-icon" title="Room Info">ℹ️</button>
            <button id="room-members-btn" class="btn btn-icon" title="Members">👥</button>
            <button id="room-settings-btn" class="btn btn-icon" title="Settings">⚙️</button>
          </div>
        </header>

        <!-- Typing Indicators -->
        <div id="typing-indicators" class="typing-indicators" style="display: none;"></div>

        <!-- Messages Area -->
        <div class="messages-container" id="messages-container">
          <div class="messages-scroll" id="messages-scroll">
            <div id="messages-list"></div>
          </div>
        </div>

        <!-- Message Input -->
        <div class="message-input-container">
          <div class="message-input-wrapper">
            <textarea
              id="message-input"
              placeholder="Type a message..."
              rows="1"
              maxlength="5000"
            ></textarea>
            <div class="message-actions">
              <button id="emoji-btn" class="btn btn-icon" title="Add Emoji">😊</button>
              <button id="attach-btn" class="btn btn-icon" title="Attach File">📎</button>
              <button id="send-btn" class="btn btn-primary">Send</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Side Panel (Room Info, Members, etc.) -->
    <aside id="side-panel" class="side-panel" style="display: none;">
      <div class="side-panel-header">
        <h3 id="side-panel-title">Panel</h3>
        <button id="close-panel-btn" class="btn btn-icon">✕</button>
      </div>
      <div id="side-panel-content" class="side-panel-content">
        <!-- Dynamic content -->
      </div>
    </aside>
  </div>

  <!-- Modals -->
  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button id="modal-close" class="btn btn-icon">✕</button>
      </div>
      <div id="modal-content" class="modal-content">
        <!-- Dynamic content -->
      </div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/websocket.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
